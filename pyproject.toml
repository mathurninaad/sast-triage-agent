[project]
name = "sast-triage"
version = "0.1.0"
description = "Runs SAST scanners on a codebase and uses an AI agent to triage each finding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.7",
    "pydantic>=2.7",
    "semgrep>=1.140",
    "typer>=0.12",
]

[project.scripts]
sast-triage = "sast_triage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sast_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
