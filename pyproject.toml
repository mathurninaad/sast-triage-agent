[project]
name = "sast-triage"
version = "0.1.0"
description = "Runs SAST scanners on a codebase and uses an AI agent to triage each finding."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bandit>=1.7",
    "langchain-core>=0.3",
    "langchain-groq>=0.3",
    "mcp>=1.9",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "semgrep>=1.140",
    "tree-sitter>=0.23",
    "tree-sitter-go>=0.25.0",
    "tree-sitter-java>=0.23.5",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-ruby>=0.23.1",
    "tree-sitter-typescript>=0.23.2",
    "typer>=0.12",
]

[project.scripts]
sast-triage = "sast_triage.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sast_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # raised inside the mcp library's settings model; not our code
    "ignore::pydantic_settings.sources.utils.IncompleteFieldDefinitionWarning",
]
